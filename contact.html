<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="keywords" content="Contact Developer, Hire MERN Developer, Web Development Collaboration">
  <meta name="author" content="Samaksh Garg">
  <title>Contact | Samaksh</title>
  <link rel="stylesheet" href="css/style.css">

<body>

  <nav class="navbar">
    <div class="logo">SAMAKSH</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <section class="contact fade-in">
    <h2>Let's Connect</h2>
    <p style="text-align: center; color: var(--text-dim); margin-bottom: 3rem;">Ready to bring your next big idea to life? Drop me a message.</p>

    <form class="contact-form" action="#" method="post" novalidate>
      <label for="fullName" class="sr-only">Full Name</label>
      <input id="fullName" name="fullName" type="text" placeholder="Full Name" autocomplete="name" required>

      <label for="emailAddress" class="sr-only">Email Address</label>
      <input id="emailAddress" name="emailAddress" type="email" placeholder="Email Address" autocomplete="email" required>

      <label for="projectDetails" class="sr-only">Project Details</label>
      <textarea id="projectDetails" name="projectDetails" rows="5" placeholder="Tell me about your project..." required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

  <footer class="footer">
    <p>© 2026 Samaksh Garg | Designed with Passion</p>
    <div class="footer-socials">
      <a href="https://github.com/samakshgarg" target="_blank" rel="noopener noreferrer" aria-label="Visit Samaksh on GitHub">GitHub</a>
      <a href="https://linkedin.com/in/samakshgarg" target="_blank" rel="noopener noreferrer" aria-label="Visit Samaksh on LinkedIn">LinkedIn</a>
      <a href="https://twitter.com/samakshgarg" target="_blank" rel="noopener noreferrer" aria-label="Visit Samaksh on Twitter">Twitter</a>
    </div>
  </footer>
  
</body>
